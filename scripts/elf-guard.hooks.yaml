# 由 scripts/make-hooks-yaml.cjs 產生，請勿手改
description: Superpowers 階段 Guard、狀態檔注入與核准憑證建立器(E-377、E-399)
bindings:
  claude:
    files:
      elf-guard.cjs: |
        'use strict';
        // Superpowers 階段 Guard：Claude Code PreToolUse hook。
        // 計畫未核准前，檔案寫入工具禁止修改 docs/superpowers/ 以外的檔案；Bash／PowerShell 指令與檔案工具都禁止碰核准目錄。
        // 只用同步 fs，不啟動子行程；hook 永遠 exit 0，以 stdout JSON 表達 deny。

        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');

        const WHITELIST_PREFIX = 'docs/superpowers/';
        // 核准憑證的九個欄位（E-399）；舊 E-377 的四欄位核准檔缺欄位，一律視為未核准。
        const CREDENTIAL_FIELDS = [
          'ticket',
          'plan',
          'spec',
          'approver_id',
          'linear_comment_id',
          'comment_created_at',
          'approved_at',
          'auditor',
          'plan_hash',
        ];
        // 核准留言認可的核准者 id：Linear user（Eddie）與 Multica 的 Gatekeeper agent。
        const APPROVER_IDS = [
          'f7c5792e-6252-49dd-8210-b15b30c5229d', // Linear user（Eddie）
          '2c8a076b-e4c0-4fc7-81b9-3ea21cd3ac82', // Multica Gatekeeper agent
        ];
        // Linear 核准者 id，供既有呼叫端與測試沿用。
        const APPROVER_ID = APPROVER_IDS[0];
        const TICKET_RE = /^E-\d+$/;
        const PLAN_HASH_RE = /^sha256:[0-9a-f]{64}$/;

        const ALLOW = { decision: 'allow' };

        // 路徑統一成正斜線。
        function toPosix(p) {
          return String(p).replace(/\\/g, '/');
        }

        function isAbsolutePosix(p) {
          return /^([A-Za-z]:)?\//.test(p);
        }

        // 讀 UTF-8 文字並去掉 BOM。
        function readText(file) {
          return fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, '');
        }

        // 取單層 YAML 欄位的值（行級解析，容忍 CRLF）；欄位不存在或空白回空字串。
        function readField(text, key) {
          const m = new RegExp('^[ \\t]*' + key + '[ \\t]*:[ \\t]*([^\\r\\n]*)', 'm').exec(text);
          if (!m) return '';
          return m[1]
            .replace(/(^|[ \t])#.*$/, '')
            .trim()
            .replace(/^(["'])(.*)\1$/, '$2')
            .trim();
        }

        // 從 startPath 往上逐層找 .git（目錄或檔案），回傳正斜線的 repo 根；找不到回 null。
        function findGitRoot(startPath) {
          let dir = path.posix.normalize(toPosix(startPath));
          for (;;) {
            if (fs.existsSync(dir + '/.git')) return dir;
            const parent = path.posix.dirname(dir);
            if (parent === dir || parent === '.') return null;
            dir = parent;
          }
        }

        // 讀目前 branch 名稱；.git 是檔案時跟隨 gitdir 指標；detached 或讀取失敗回 null。
        function readBranch(gitRoot) {
          try {
            let gitDir = gitRoot + '/.git';
            if (fs.statSync(gitDir).isFile()) {
              const m = /^gitdir:[ \t]*([^\r\n]+)/m.exec(readText(gitDir));
              if (!m) return null;
              const target = toPosix(m[1].trim());
              gitDir = isAbsolutePosix(target) ? target : path.posix.join(gitRoot, target);
            }
            const head = /^ref:[ \t]*refs\/heads\/([^\r\n]+)/m.exec(readText(gitDir + '/HEAD'));
            return head ? head[1].trim() : null;
          } catch {
            return null;
          }
        }

        // 從分支名稱取出單號：Orca 的 e-<N>，或團隊規範的 <類型>/e-<N>-<英文短名>
        // （elf-team-rule 規則 10：類型 feat、fix、docs、chore、test、hotfix；短名小寫英數字，以 - 連接）。其餘回 null。
        const BRANCH_RE = /^(?:e-(\d+)|(?:feat|fix|docs|chore|test|hotfix)\/e-(\d+)-[a-z0-9]+(?:-[a-z0-9]+)*)$/;

        function branchTicket(branch) {
          if (typeof branch !== 'string') return null;
          const m = BRANCH_RE.exec(branch);
          return m ? m[1] || m[2] : null;
        }

        // 解析單一狀態檔；ticket 與 plan 都解析不出值回 null。
        function parseState(file) {
          try {
            const text = readText(file);
            const ticket = readField(text, 'ticket');
            const plan = readField(text, 'plan');
            if (!ticket && !plan) return null;
            return { file, ticket, phase: readField(text, 'phase'), plan };
          } catch {
            return null;
          }
        }

        // 找 E-<n> 對應的狀態檔：先讀 state/E-<n>.yaml，沒有就掃 state/*.yaml 取 plan 等於 E-<n> 的第一份。
        function findState(gitRoot, n) {
          const stateDir = gitRoot + '/docs/superpowers/state';
          const id = 'E-' + n;
          const direct = stateDir + '/' + id + '.yaml';
          if (fs.existsSync(direct)) return parseState(direct) || 'invalid';
          let names;
          try {
            names = fs.readdirSync(stateDir).filter((name) => name.endsWith('.yaml')).sort();
          } catch {
            return 'missing';
          }
          for (const name of names) {
            const state = parseState(stateDir + '/' + name);
            if (state && state.plan === id) return state;
          }
          return 'missing';
        }

        // 讀核准憑證 <dir>/<plan>.yaml：九欄皆非空、ticket 與 plan 等於檔名、spec 為 E-<數字>、
        // approver_id 在核准者名單內、plan_hash 為 sha256 格式才回傳欄位物件；其餘回 null。
        function readCredential(dir, plan) {
          if (typeof plan !== 'string' || !TICKET_RE.test(plan)) return null;
          try {
            const text = readText(path.join(dir, plan + '.yaml'));
            const cred = {};
            for (const key of CREDENTIAL_FIELDS) {
              const value = readField(text, key);
              if (value === '') return null;
              cred[key] = value;
            }
            if (cred.ticket !== plan || cred.plan !== plan) return null;
            if (!TICKET_RE.test(cred.spec) || !APPROVER_IDS.includes(cred.approver_id) || !PLAN_HASH_RE.test(cred.plan_hash)) return null;
            return cred;
          } catch {
            return null;
          }
        }

        // 該 Plan 有格式正確的核准憑證才算已核准。
        function readApproval(dir, plan) {
          return readCredential(dir, plan) !== null;
        }

        // 目標路徑相對 repo 根的位置（正斜線）；不在 repo 底下回 null。
        function relativeToRoot(root, target) {
          const prefix = root.endsWith('/') ? root : root + '/';
          if (target.length < prefix.length || target.slice(0, prefix.length).toLowerCase() !== prefix.toLowerCase()) {
            return null;
          }
          return target.slice(prefix.length);
        }

        function deny(reason) {
          return { decision: 'deny', reason };
        }

        function decideUnsafe(payload, opts) {
          const approvalsDir = opts.approvalsDir || path.join(os.homedir(), '.claude', 'superpowers', 'approvals');
          const toolName = payload.tool_name;
          const input = payload.tool_input || {};

          // 1. Bash／PowerShell 碰核准目錄：核准前後都擋。
          if ((toolName === 'Bash' || toolName === 'PowerShell') && /superpowers[\\/]approvals/i.test(String(input.command || ''))) {
            return deny('Superpowers 階段 Guard：禁止用 Bash 或 PowerShell 存取 superpowers/approvals 核准目錄。核准憑證只能用核准憑證建立器（elf-approval.cjs）建立。');
          }

          // 2. 取檔案類工具的目標路徑；目標在核准目錄底下一律擋。
          const rawTarget = input.file_path || input.notebook_path;
          if (!rawTarget) return ALLOW;
          let target = toPosix(rawTarget);
          if (!isAbsolutePosix(target)) {
            target = path.posix.join(toPosix(payload.cwd || process.cwd()), target);
          }
          target = path.posix.normalize(target);
          if (/superpowers\/approvals/i.test(target)) {
            return deny('Superpowers 階段 Guard：禁止用檔案工具寫入 superpowers/approvals 核准目錄。核准憑證只能用核准憑證建立器（elf-approval.cjs）建立。');
          }
          // 找出 repo 根。
          const gitRoot = findGitRoot(target);
          if (!gitRoot) return ALLOW;

          // 3. 只管 e-<數字> 與 <類型>/e-<數字>-<短名> 分支。
          const n = branchTicket(readBranch(gitRoot));
          if (!n) return ALLOW;

          // 4. 沒有對應狀態檔或狀態檔無法解析：放行。
          const state = findState(gitRoot, n);
          if (state === 'missing' || state === 'invalid') return ALLOW;

          // 5. 計畫已核准：放行。
          if (readApproval(approvalsDir, state.plan)) return ALLOW;

          // 6. 未核准時只允許 docs/superpowers/ 底下的檔案。
          const rel = relativeToRoot(gitRoot, target);
          if (rel !== null && rel.toLowerCase().startsWith(WHITELIST_PREFIX)) return ALLOW;
          const id = state.plan || state.ticket;
          return deny(
            `Superpowers 階段 Guard：${id} 計畫未核准，目前只能修改 docs/superpowers/ 底下的檔案。` +
              '請先完成 spec／plan，由審計員在 Linear 或 Multica 留言核准後，用核准憑證建立器建立核准憑證，再繼續實作。',
          );
        }

        // 判斷單次工具呼叫；Guard 自身發生例外時放行。
        function decide(payload, opts = {}) {
          try {
            return decideUnsafe(payload || {}, opts || {});
          } catch {
            return ALLOW;
          }
        }

        function main() {
          try {
            const payload = JSON.parse(fs.readFileSync(0, 'utf8').replace(/^\uFEFF/, ''));
            const result = decide(payload);
            if (result.decision === 'deny') {
              process.stdout.write(
                JSON.stringify({
                  hookSpecificOutput: {
                    hookEventName: 'PreToolUse',
                    permissionDecision: 'deny',
                    permissionDecisionReason: result.reason,
                  },
                }),
              );
            }
          } catch {
            // Guard 自身失敗時不輸出任何內容，等同放行。
          }
          process.exitCode = 0;
        }

        module.exports = {
          decide,
          findGitRoot,
          readBranch,
          findState,
          readApproval,
          readCredential,
          branchTicket,
          APPROVER_ID,
          APPROVER_IDS,
          CREDENTIAL_FIELDS,
        };

        if (require.main === module) {
          main();
        }
      elf-sessionstart.cjs: |
        'use strict';
        // Superpowers 階段 Guard：Claude Code SessionStart hook。
        // e-<數字> 或 <類型>/e-<數字>-<短名> 分支且有狀態檔時，把 ticket、phase、plan 與核准狀態印到 stdout 供新 session 續跑。
        // 只用同步 fs，不啟動子行程；hook 永遠 exit 0。

        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');

        const { findGitRoot, readBranch, findState, readApproval, branchTicket } = require('./elf-guard.cjs');

        // 路徑統一成正斜線。
        function toPosix(p) {
          return String(p).replace(/\\/g, '/');
        }

        // 狀態檔路徑相對 repo 根（正斜線）；不在 repo 底下時原樣回傳。
        function relativeFile(gitRoot, file) {
          const prefix = gitRoot.endsWith('/') ? gitRoot : gitRoot + '/';
          const posix = toPosix(file);
          return posix.slice(0, prefix.length).toLowerCase() === prefix.toLowerCase() ? posix.slice(prefix.length) : posix;
        }

        function summarizeUnsafe(cwd, opts) {
          const approvalsDir = opts.approvalsDir || path.join(os.homedir(), '.claude', 'superpowers', 'approvals');
          const gitRoot = findGitRoot(path.resolve(String(cwd)));
          if (!gitRoot) return null;

          const n = branchTicket(readBranch(gitRoot));
          if (!n) return null;

          const state = findState(gitRoot, n);
          if (state === 'missing' || state === 'invalid') return null;

          const approval = readApproval(approvalsDir, state.plan) ? '已核准' : '未核准';
          const file = relativeFile(gitRoot, state.file);
          return `[superpowers 狀態] ticket=${state.ticket} phase=${state.phase} plan=${state.plan} 核准=${approval}。續跑:讀 ${file} 與 Linear 票。`;
        }

        // 產生 SessionStart 要注入的狀態摘要；沒有可用狀態時回 null。
        function summarize(cwd, opts = {}) {
          try {
            return summarizeUnsafe(cwd, opts || {});
          } catch {
            return null;
          }
        }

        function main() {
          try {
            let cwd = process.cwd();
            try {
              const payload = JSON.parse(fs.readFileSync(0, 'utf8').replace(/^\uFEFF/, ''));
              if (payload && typeof payload.cwd === 'string' && payload.cwd) cwd = payload.cwd;
            } catch {
              // stdin 無法解析時改用目前目錄。
            }
            const text = summarize(cwd);
            if (text !== null) process.stdout.write(text + '\n');
          } catch {
            // 失敗時不輸出任何內容。
          }
          process.exitCode = 0;
        }

        module.exports = { summarize };

        if (require.main === module) {
          main();
        }
      elf-approval.cjs: |
        'use strict';
        // Superpowers 核准憑證建立器：依 AI 從 Linear 或 Multica 讀出的 Plan 描述與留言，判斷核准留言、計算 Plan 內容雜湊，
        // 並建立（create）、驗證（verify）、撤回（revoke）單一 Plan 的核准憑證。
        // 留言同時接受 Linear 形狀（body／createdAt／author.id）與 Multica CLI 形狀（content／created_at／author_id）。
        // 用法：node elf-approval.cjs create|verify --plan E-<N> --input <json>
        //       node elf-approval.cjs revoke --plan E-<N> [--reason <文字>]
        // exit 0＝成功、1＝驗證不通過、2＝參數錯誤。只用同步 fs 與 crypto，不啟動子行程、不連網路。

        const crypto = require('node:crypto');
        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');

        const { APPROVER_IDS, CREDENTIAL_FIELDS, readCredential } = require('./elf-guard.cjs');

        const TICKET_RE = /^E-\d+$/;
        // 憑證欄位值不得含換行、# 與引號：單層 YAML 的行級解析會把它們讀成別的意思。
        const SAFE_VALUE_RE = /^[^\r\n#"']+$/;

        const FENCE_RE = /^[ \t]*```/;
        const CHECKED_RE = /^([ \t]*)- \[[xX]\]/;
        const ISSUE_TAG_RE = /<issue\b[^>]*?\bid="([^"]*)"[^>]*>/g;
        const MODIFIED_RE = /^計畫已修改 v(\d+)/;
        const REVOKED_RE = /^核准撤回/;
        const APPROVED_RE = /^計畫已核准(?: v(\d+))?（(\d{4}-\d{2}-\d{2})，審計員：([^）\n]+)）/;

        // 正規化 Plan 描述（E-397 第 18 點）：換行統一為 LF；圍欄外行首的已勾 checkbox 改回未勾；
        // <issue> 連結標籤只保留 id 屬性；結尾恰好一個 LF。
        function normalizeDescription(text) {
          let inFence = false;
          const lines = String(text).replace(/\r\n?/g, '\n').split('\n').map((line) => {
            if (FENCE_RE.test(line)) {
              inFence = !inFence;
              return line;
            }
            return inFence ? line : line.replace(CHECKED_RE, '$1- [ ]');
          });
          return lines.join('\n').replace(ISSUE_TAG_RE, '<issue id="$1">').replace(/\n+$/, '') + '\n';
        }

        // 正規化後對 UTF-8 位元組算 SHA-256，回傳 `sha256:<hex>`。
        function hashDescription(text) {
          return 'sha256:' + crypto.createHash('sha256').update(normalizeDescription(text), 'utf8').digest('hex');
        }

        // 把一則留言統一成 Linear 形狀 { id, body, createdAt, author: { id } }：
        // 有 Linear 欄位就用 Linear 欄位，否則取 Multica CLI 的 content／created_at／author_id；不是物件回 null。
        function normalizeComment(c) {
          if (!c || typeof c !== 'object') return null;
          const body = typeof c.body === 'string' ? c.body : c.content;
          const createdAt = c.createdAt !== undefined ? c.createdAt : c.created_at;
          const authorId = c.author && typeof c.author === 'object' && c.author.id !== undefined ? c.author.id : c.author_id;
          return { id: c.id, body, createdAt, author: { id: authorId } };
        }

        // 依 createdAt 的實際時間由舊到新（同時間保留原順序）找出目前有效的核准留言；修改與撤回不限作者，核准只認 APPROVER_IDS 內的作者。
        function findApproval(comments) {
          const sorted = (Array.isArray(comments) ? comments : [])
            .map(normalizeComment)
            .filter((c) => c && typeof c.body === 'string')
            .map((c, i) => ({ c, i, t: Date.parse(c.createdAt) }))
            .sort((x, y) => x.t - y.t || x.i - y.i)
            .map((x) => x.c);
          let required = 1;
          let current = null;
          let lastBlock = '';
          for (const c of sorted) {
            const body = c.body.replace(/^\s+/, '');
            const modified = MODIFIED_RE.exec(body);
            if (modified) {
              required = Math.max(required, Number(modified[1]));
              current = null;
              lastBlock = `計畫已修改 v${modified[1]} 之後沒有對應版號的核准留言`;
              continue;
            }
            if (REVOKED_RE.test(body)) {
              current = null;
              lastBlock = '最後一則核准之後有「核准撤回」';
              continue;
            }
            const approved = APPROVED_RE.exec(body);
            if (!approved || !APPROVER_IDS.includes(c.author.id)) continue;
            const version = approved[1] ? Number(approved[1]) : 1;
            if (version < required) continue;
            current = { ok: true, comment: c, auditor: approved[3].trim(), approvedAt: approved[2], version };
          }
          if (current) return current;
          return { ok: false, reason: lastBlock ? `找不到有效的核准留言：${lastBlock}` : '找不到有效的核准留言' };
        }

        function defaultApprovalsDir() {
          return path.join(os.homedir(), '.claude', 'superpowers', 'approvals');
        }

        // 檢查 --plan 與輸入 JSON；不通過回 reason 字串，通過回 null。
        function checkInput(input, plan) {
          if (typeof plan !== 'string' || !TICKET_RE.test(plan)) return `Plan 編號格式不符：${plan}`;
          if (!input || typeof input !== 'object') return '輸入不是 JSON 物件';
          if (input.plan !== plan) return `輸入的 plan（${input.plan}）與 --plan（${plan}）不同`;
          if (typeof input.spec !== 'string' || !TICKET_RE.test(input.spec)) return `輸入的 spec 格式不符：${input.spec}`;
          if (typeof input.description !== 'string' || input.description === '') return '輸入缺少 Plan 描述';
          if (!Array.isArray(input.comments)) return '輸入缺少留言陣列';
          for (const raw of input.comments) {
            const c = normalizeComment(raw);
            const ok = c && typeof c.id === 'string' && c.id !== '' && typeof c.body === 'string' && typeof c.author.id === 'string'
              && Number.isFinite(Date.parse(c.createdAt));
            if (!ok) return `留言欄位不完整（需要 id、body|content、createdAt|created_at、author.id|author_id）：${JSON.stringify(raw && raw.id)}`;
          }
          return null;
        }

        // 原子寫入：同目錄暫存檔（檔名不符合 E-<數字>.yaml）寫完再 rename。
        function writeAtomic(file, text) {
          const tmp = path.join(path.dirname(file), `.${path.basename(file)}.${process.pid}.tmp`);
          try {
            fs.writeFileSync(tmp, text, { encoding: 'utf8' });
            fs.renameSync(tmp, file);
          } catch (err) {
            fs.rmSync(tmp, { force: true });
            throw err;
          }
        }

        // 依有效核准留言建立單一 Plan 的核准憑證。
        function createCredential(input, { plan, approvalsDir = defaultApprovalsDir() } = {}) {
          const bad = checkInput(input, plan);
          if (bad) return { ok: false, reason: bad };
          const found = findApproval(input.comments);
          if (!found.ok) return { ok: false, reason: found.reason };
          const credential = {
            ticket: plan,
            plan,
            spec: input.spec,
            approver_id: found.comment.author.id,
            linear_comment_id: String(found.comment.id),
            comment_created_at: String(found.comment.createdAt),
            approved_at: found.approvedAt,
            auditor: found.auditor,
            plan_hash: hashDescription(input.description),
          };
          for (const key of CREDENTIAL_FIELDS) {
            if (!SAFE_VALUE_RE.test(credential[key])) return { ok: false, reason: `欄位 ${key} 的值不能寫入憑證：${credential[key]}` };
          }
          const file = path.join(approvalsDir, plan + '.yaml');
          try {
            fs.mkdirSync(approvalsDir, { recursive: true });
            writeAtomic(file, CREDENTIAL_FIELDS.map((key) => `${key}: ${credential[key]}\n`).join(''));
          } catch (err) {
            return { ok: false, reason: `寫入核准憑證失敗：${err.message}` };
          }
          return { ok: true, credential, file };
        }

        // 驗證本機憑證仍對應目前有效的核准留言與 Plan 描述；只讀不刪。
        function verifyCredential(input, { plan, approvalsDir = defaultApprovalsDir() } = {}) {
          const bad = checkInput(input, plan);
          if (bad) return { ok: false, reason: bad, action: 'stop' };
          const credential = readCredential(approvalsDir, plan);
          if (!credential) return { ok: false, reason: '沒有有效的核准憑證（不存在、損壞或欄位不符）', action: 'stop' };
          if (credential.spec !== input.spec) return { ok: false, reason: `憑證的 spec（${credential.spec}）與輸入不同`, action: 'stop' };
          const found = findApproval(input.comments);
          if (!found.ok) return { ok: false, reason: found.reason, action: 'revoke' };
          if (!input.comments.some((c) => c && String(c.id) === credential.linear_comment_id)) {
            return { ok: false, reason: `憑證引用的核准留言 ${credential.linear_comment_id} 已不在 Plan 上`, action: 'revoke' };
          }
          if (String(found.comment.id) !== credential.linear_comment_id) {
            return { ok: false, reason: `目前有效的核准留言是 ${found.comment.id}，不是憑證引用的那則`, action: 'recreate' };
          }
          const hash = hashDescription(input.description);
          if (hash !== credential.plan_hash) {
            return { ok: false, reason: `Plan 描述雜湊不符（憑證 ${credential.plan_hash}，目前 ${hash}）`, action: 'stop' };
          }
          return { ok: true, credential };
        }

        // 刪除單一 Plan 的核准憑證；檔案本來就不存在時 removed 為 false。
        function revokeCredential({ plan, approvalsDir = defaultApprovalsDir() } = {}) {
          if (typeof plan !== 'string' || !TICKET_RE.test(plan)) return { removed: false };
          const file = path.join(approvalsDir, plan + '.yaml');
          if (!fs.existsSync(file)) return { removed: false };
          fs.rmSync(file);
          return { removed: true };
        }

        const NEXT_STEP = {
          revoke: '執行 revoke 刪除憑證、停止實作，並在 Plan 留言',
          recreate: '依目前有效的核准留言重新執行 create',
          stop: '停下回報 Eddie，不開工、不自行重建憑證',
        };

        function parseArgs(argv) {
          const args = { mode: argv[0] };
          for (let i = 1; i < argv.length; i += 2) {
            const key = argv[i];
            if (!/^--(plan|input|approvals-dir|reason)$/.test(key) || i + 1 >= argv.length) return null;
            args[key.slice(2)] = argv[i + 1];
          }
          return args;
        }

        function printSummary(mode, plan, spec, credential, result) {
          const lines = [`[elf-approval] ${mode} ${plan}${spec ? `（Spec ${spec}）` : ''}：${result}`];
          if (credential) {
            lines.push(`  linear_comment_id: ${credential.linear_comment_id}`);
            lines.push(`  核准者: ${credential.approver_id}`);
            lines.push(`  留言時間: ${credential.comment_created_at}`);
            lines.push(`  審計員: ${credential.auditor}（${credential.approved_at}）`);
            lines.push(`  plan_hash: ${credential.plan_hash}`);
            lines.push(`  檔案: ${plan}.yaml`);
          }
          process.stdout.write(lines.join('\n') + '\n');
        }

        function main(argv) {
          const args = parseArgs(argv);
          if (!args || !['create', 'verify', 'revoke'].includes(args.mode) || !args.plan || (args.mode !== 'revoke' && !args.input)) {
            process.stderr.write('用法：node elf-approval.cjs create|verify --plan E-<N> --input <json>\n      node elf-approval.cjs revoke --plan E-<N> [--reason <文字>]\n');
            return 2;
          }
          const opts = { plan: args.plan, approvalsDir: args['approvals-dir'] || defaultApprovalsDir() };
          if (args.mode === 'revoke') {
            if (!TICKET_RE.test(args.plan)) {
              process.stderr.write(`Plan 編號格式不符：${args.plan}\n`);
              return 2;
            }
            const { removed } = revokeCredential(opts);
            printSummary('revoke', args.plan, '', null, removed ? '已刪除核准憑證' : '沒有核准憑證可刪');
            if (args.reason) process.stdout.write(`  原因: ${args.reason}\n`);
            return 0;
          }
          let input;
          try {
            input = JSON.parse(fs.readFileSync(args.input, 'utf8').replace(/^﻿/, ''));
          } catch (err) {
            printSummary(args.mode, args.plan, '', null, '失敗');
            process.stdout.write(`  原因: 讀不到輸入 JSON（${err.message}）\n  建議動作: ${NEXT_STEP.stop}\n`);
            return 1;
          }
          const result = args.mode === 'create' ? createCredential(input, opts) : verifyCredential(input, opts);
          if (result.ok) {
            printSummary(args.mode, args.plan, input.spec, result.credential, args.mode === 'create' ? '已建立核准憑證' : '驗證通過');
            return 0;
          }
          printSummary(args.mode, args.plan, input && input.spec, null, '失敗');
          process.stdout.write(`  原因: ${result.reason}\n  建議動作: ${NEXT_STEP[result.action || 'stop']}\n`);
          return 1;
        }

        module.exports = {
          normalizeDescription,
          hashDescription,
          normalizeComment,
          findApproval,
          createCredential,
          verifyCredential,
          revokeCredential,
        };

        if (require.main === module) {
          process.exitCode = main(process.argv.slice(2));
        }
    events:
      PreToolUse:
        - matcher: "Write|Edit|MultiEdit|NotebookEdit|Bash|PowerShell"
          hooks:
            - type: command
              command: 'node "$HOME/.claude/hooks/skillshare/elf-guard/elf-guard.cjs"'
              timeout: 10
      SessionStart:
        - hooks:
            - type: command
              command: 'node "$HOME/.claude/hooks/skillshare/elf-guard/elf-sessionstart.cjs"'
              timeout: 10
