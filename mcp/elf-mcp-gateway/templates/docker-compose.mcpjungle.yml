# MCPJungle gateway + Postgres + docs-mcp + 一次性 registrar。完全自包含:
#   - DB 內建(postgres service)→ 不必自己先準備一顆 Postgres、不必 docker network create。
#     要改接既有的外部 DB:在 .env 設 MCPJUNGLE_DATABASE_URL 覆寫即可,內建這顆可留著不用。
#   - 網路 mcpjungl 由本 stack「自建」(部署時自動建 <project>_mcpjungl,像 immich_default 那樣)。
# 機密走 .env,不進 git。
# 起(零設定,不必先 cp .env.example):
#   docker compose -f docker-compose.mcpjungle.yml up -d --build
services:
  # 內建 Postgres。預設帳號/密碼/DB 名皆為 mcpjungle,且不對外開 port(僅 mcpjungl 網路內可達)。
  # 正式環境:在 .env 設 POSTGRES_PASSWORD,並同步改 MCPJUNGLE_DATABASE_URL 裡的密碼(兩處要一致)。
  postgres:
    image: postgres:16-alpine
    container_name: mcpjungle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpjungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpjungle}
      POSTGRES_DB: ${POSTGRES_DB:-mcpjungle}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - pgdata:/var/lib/postgresql/data      # 持久化:容器重建資料仍在
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpjungle} -d ${POSTGRES_DB:-mcpjungle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mcpjungl]
    restart: always

  mcpjungle:
    build:
      context: ./MCPJungle
      dockerfile: Dockerfile.fullbuild
    image: mcpjungle-fork:latest
    container_name: mcpjungle-server
    depends_on:
      postgres:
        condition: service_healthy    # 等 DB 真的可連才啟動,避免首次部署搶跑
    environment:
      # 預設連內建的 postgres 容器(零設定即可跑)。要接外部 DB:在 .env 設 MCPJUNGLE_DATABASE_URL 覆寫。
      DATABASE_URL: ${MCPJUNGLE_DATABASE_URL:-postgres://mcpjungle:mcpjungle@postgres:5432/mcpjungle?sslmode=disable}
      SERVER_MODE: ${SERVER_MODE:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: ${MCP_SERVER_INIT_REQ_TIMEOUT_SEC:-30}
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - "${MCPJUNGLE_HOST_PORT:-18800}:8080"
    volumes:
      - ${MCPJUNGLE_DATA_DIR:-/mnt/docker/app/data/mcpjungle}:/host:ro
    networks: [mcpjungl]
    restart: always

  docs-mcp-server:
    build: ../mcp/docs-mcp-server
    image: ghcr.io/elf-express/docs-mcp-server:latest
    container_name: docs-mcp-server
    environment:
      TRANSPORT: http
      PORT: "5690"
      # dev 留空 = 僅內部網路可達。要硬化:設 DOCS_MCP_AUTH_TOKEN 並在 servers/*.json 加 bearer_token。
      MCP_AUTH_TOKEN: ${DOCS_MCP_AUTH_TOKEN:-}
      TZ: ${TZ:-Asia/Taipei}
    networks: [mcpjungl]
    restart: unless-stopped

  # 一次性:等 gateway 起來後自動把所有 server 註冊,然後結束(GitOps 自動部署)。
  # 設定檔 + 腳本烤進 image(不用 bind mount,Dockhand 等 clone-進容器的工具才相容)。
  registrar:
    build:
      context: .
      dockerfile: Dockerfile.registrar
    image: ghcr.io/elf-express/docs-registrar:latest
    depends_on:
      - mcpjungle
      - docs-mcp-server
    environment:
      REGISTRY_URL: http://mcpjungle:8080
      TZ: ${TZ:-Asia/Taipei}
    networks: [mcpjungl]
    restart: "no"

volumes:
  pgdata:                 # 內建 Postgres 的資料。docker compose down 不會刪,down -v 才會

networks:
  mcpjungl:
    driver: bridge        # 本 stack 自建(prefix 為 <project>_mcpjungl);不必先 docker network create
