# =============================================================================
# nginx 反向代理範例 — MCPJungle gateway(及其後的 docs-mcp)
#
# 拓樸:
#   公網(HTTPS) → nginx(本檔:TLS 終止 + rate limit + SSE 轉發)
#                   └→ 內網 gateway <GATEWAY_LAN_IP>:18800 → docs-mcp:5690(更內層,不對外)
#
# 為什麼 rate limit 放這裡、不放應用層:
#   - 邊界優先:惡意流量在最外層就被擋,根本不進內網。
#   - MCP 走 SSE 長連接,nginx 預設會 buffer + 60s timeout 掐斷它 —— 必須關 buffering、拉長 timeout(見 /mcp)。
#   - 關注點分離:docs-mcp 管「查文檔」,nginx 管「TLS / rate limit / 轉發」。
#
# 用前只改三處:① server_name(網域)② ssl_certificate(憑證)③ upstream 的內網 IP。
# 貼進 nginxWebUI 的「設定檔」或放 /etc/nginx/conf.d/mcp.conf 都可。
# =============================================================================

# ---- rate limit / 連線數 zone(必須放在 http{} 區塊;nginxWebUI 通常有「http 全域」欄)----
#   每 IP 每秒 10 次請求;burst 緩衝 20。依你的用戶數調。
limit_req_zone  $binary_remote_addr zone=mcp:10m      rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mcpconn:10m;

# ---- 內網 gateway 位址 ----
upstream mcpjungle_gateway {
    server <GATEWAY_LAN_IP>:18800;   # ← ③ 改成你內網 gateway 的 IP:PORT(nginx 與 gateway 同機可用 127.0.0.1:18800)
    keepalive 32;
}

# ---- HTTP → HTTPS 轉址 ----
server {
    listen 80;
    server_name mcp.example.com;   # ← ① 改成你的網域
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25.1 請改成上一行 `listen 443 ssl http2;` 並刪掉本行
    server_name mcp.example.com;   # ← ① 改

    # --- TLS(Let's Encrypt / 內部 CA / 自簽 都可)---
    ssl_certificate     /etc/nginx/certs/mcp.example.com.crt;   # ← ② 改
    ssl_certificate_key /etc/nginx/certs/mcp.example.com.key;   # ← ② 改
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上傳上限對齊 docs-mcp 的 express.json({ limit: "8mb" })
    client_max_body_size 8m;

    # --- 健康檢查:免 rate limit,給雲端/監控探測 ---
    location = /health {
        proxy_pass http://mcpjungle_gateway;
        proxy_set_header Host $host;
    }

    # --- MCP 入口:SSE 長連接 + rate limit ---
    #   注意:location /mcp 同時涵蓋 /mcp 與 /mcp/<corpus>(前綴匹配)。
    location /mcp {
        # rate limit:每 IP 10r/s,容許瞬間 burst 20 不延遲;超限回 429
        limit_req       zone=mcp burst=20 nodelay;
        limit_conn      mcpconn 20;        # 同 IP 最多 20 條並發長連接
        limit_req_status 429;

        proxy_pass http://mcpjungle_gateway;

        # ★ MCP / SSE 必備 —— 少了這幾行,AI 會「能呼叫工具但收不到串流回應」,極難查:
        proxy_http_version 1.1;
        proxy_set_header Connection "";    # 不要送 "close",維持長連接
        proxy_buffering    off;            # SSE 不能 buffer,否則通知卡住
        proxy_cache        off;
        proxy_read_timeout 3600s;          # 長連接別 60 秒就斷
        proxy_send_timeout 3600s;

        # 透傳真實來源 + bearer token(Authorization 預設就會帶,明寫保險)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # --- (選用)MCPJungle dashboard:管理介面別對公網開,只放行內網來源 ---
    # location / {
    #     allow 192.168.0.0/16;   # ← 你的內網段
    #     allow 127.0.0.1;
    #     deny  all;
    #     proxy_pass http://mcpjungle_gateway;
    #     proxy_set_header Host $host;
    # }
}
