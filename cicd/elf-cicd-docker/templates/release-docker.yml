name: Release

# Container images for the web deployment.
#
# - Project WITH a desktop app: copy only `jobs.docker` below into the existing
#   release.yml from elf-cicd-desktop, so one tag runs one workflow.
# - Web-only project: use this whole file as .github/workflows/release.yml.
#
# Images: ghcr.io/<owner>/<repo>/api and ghcr.io/<owner>/<repo>/web,
# each tagged with the release tag and `latest`.
# When the project also ships a desktop app, keep the GHCR line at the end of
# .github/release-body.md (elf-cicd-desktop) so the release page links the images.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.0.1)'
        required: true
        type: string

jobs:
  # The tag must equal package.json's version and point at a commit on the
  # release branch (elf-cicd-versioning). Nothing is built when it does not.
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history, so origin/release is there to compare against.
          fetch-depth: 0

      - name: Tag must match the version and sit on release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/release; then
            echo "::error::$TAG is not on release. Fast-forward release first, then tag the commit it points to."
            exit 1
          fi

  docker:
    name: container images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GHCR rejects upper-case names, and the repository slug may have them.
      - name: Normalise image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/api:${{ inputs.tag || github.ref_name }}
            ${{ steps.img.outputs.prefix }}/api:latest
          # One scope per image: both builds share the default scope otherwise,
          # and each mode=max export replaces the other's cache.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_USE_MOCK=false
          tags: |
            ${{ steps.img.outputs.prefix }}/web:${{ inputs.tag || github.ref_name }}
            ${{ steps.img.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
