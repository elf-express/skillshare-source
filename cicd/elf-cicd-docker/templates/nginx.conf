# docker/nginx.conf — copied into the web image as /etc/nginx/conf.d/<app>.conf
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Same-origin API: the bundle calls /api/... and nginx forwards it to the
    # backend container, so the browser never sees a cross-origin request.
    # `api` is the compose service name; 8080 is ASPNETCORE_HTTP_PORTS.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed filenames — safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. The team router uses hash history (createWebHashHistory, so the
    # same bundle works under Tauri's file-less origin): routes live after `#` and
    # never reach nginx. The fallback only matters if a project switches to
    # createWebHistory — then it keeps a hard refresh on /orders/42 from a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
